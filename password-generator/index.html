  <script>
    function buildPassword() {
      const length = parseInt(document.getElementById('input-length').value) || 12;
      const useUpper = document.getElementById('check-upper').checked;
      const useNumbers = document.getElementById('check-numbers').checked;
      const useSymbols = document.getElementById('check-symbols').checked;

      let lower = "abcdefghijklmnopqrstuvwxyz";
      let upper = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
      let numbers = "0123456789";
      let symbols = "!@#$%^&*()_+-=[]{}|;:,./<>?";

      let pool = lower;
      if (useUpper) pool += upper;
      if (useNumbers) pool += numbers;
      if (useSymbols) pool += symbols;

      let password = "";

      // Cryptographically secure pseudorandom number generator values
      const randomValues = new Uint32Array(length);
      window.crypto.getRandomValues(randomValues);

      for (let i = 0; i < length; i++) {
        password += pool[randomValues[i] % pool.length];
      }

      document.getElementById('out-password').textContent = password;
    }

    function copyPassword() {
      const btn = document.getElementById('btn-copy');
      const text = btn.querySelector('span');
      const password = document.getElementById('out-password').textContent;
      navigator.clipboard.writeText(password).then(() => {
        text.textContent = 'Copied Password!';
        setTimeout(() => { text.textContent = 'Copy Password'; }, 2000);
      });
    }

    window.addEventListener('DOMContentLoaded', buildPassword);
  </script>
