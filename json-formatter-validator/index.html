<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">   <meta name="google-adsense-account" content="ca-pub-3901061173891576">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Free Secure JSON Formatter & Validator | Beautify & Parse JSON Errors</title>
  <meta name="description" content="Beautify, compress, format, and validate raw JSON code arrays offline. 100% secure client-side parsing. No data leaves your machine. 100% Free, No Sign-Up.">
  <link rel="canonical" href="https://topwebtool.com/json-formatter-validator/">
  <link rel="stylesheet" href="../styles.css">


</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen flex flex-col pb-4 transition-colors duration-200">

  <header id="global-header"></header>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex-grow">

    <!-- AD A REMOVED -->

    <!-- 2-Column Grid -->
    <div class="grid grid-cols-1 lg:grid-cols-4 gap-4">

      <!-- Main Content -->
      <div class="lg:col-span-3 space-y-8">

        <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
          <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight sm:text-4xl">JSON Formatter & Validator</h1>
          <p class="mt-2 text-base text-slate-500">
            Beautify, compress, validate, and verify raw JSON code arrays. Safe, offline local parsing logic inside your browser.
          </p>
        </div>

        <!-- Calculator UI -->
        <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-6 sm:p-8 space-y-6">
          <h2 class="text-lg font-bold text-slate-900 border-b border-slate-100 pb-3">Raw JSON Input</h2>

          <div class="space-y-4">
            <textarea id="input-json" rows="8" class="block w-full px-3 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-brand-500 focus:border-brand-500 text-slate-950 font-mono text-xs" oninput="validateJSON()">{"name":"TopWebTool","active":true,"list":[1,2,3]}</textarea>

            <div class="flex flex-wrap gap-3">
              <button onclick="beautifyJSON()" class="px-4 py-2 bg-brand-600 text-white hover:bg-brand-700 transition-colors font-bold text-xs rounded-lg">Beautify (Format)</button>
              <button onclick="minifyJSON()" class="px-4 py-2 bg-slate-100 text-slate-700 hover:bg-slate-200 transition-colors font-semibold text-xs rounded-lg">Minify (Compress)</button>
            </div>
          </div>
        </div>

        <!-- Output Cards -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div class="bg-gradient-to-br from-brand-600 to-brand-800 p-6 rounded-2xl text-white shadow-md">
            <span class="text-xs uppercase font-bold tracking-wider opacity-85 block">JSON Validation State</span>
            <span class="text-xl font-extrabold mt-2 block animate-pulse" id="out-state">Perfect & Valid</span>
          </div>
          <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
            <span class="text-xs uppercase font-bold tracking-wider text-slate-400 block">Total String Length</span>
            <span class="text-xl font-extrabold mt-2 text-slate-800 block" id="out-size">0 chars</span>
          </div>
        </div>

        <!-- Display Area -->
        <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-4">
          <h2 class="text-lg font-bold text-slate-900 border-b border-slate-100 pb-2">Formatted / Diagnostic Code</h2>
          <pre class="bg-slate-950 text-emerald-400 p-4 rounded-xl font-mono text-xs overflow-x-auto shadow-inner" id="out-formatted">...</pre>
          <div class="flex justify-end pt-2">
            <button onclick="copyFormatted()" id="btn-copy" class="px-5 py-2.5 bg-brand-600 text-white hover:bg-brand-700 transition-colors font-bold text-sm rounded-lg shadow-sm">
              <span>Copy Code</span>
            </button>
          </div>
        </div>

      </div>

      <!-- Column 4 Sidebar -->
      <div class="lg:col-span-1 space-y-6">

        <div id="trending-sidebar"></div>

        <!-- AD B REMOVED -->

      </div>

    </div>

  </main>

  <!-- AD C REMOVED -->

  <script>
    function validateJSON() {
      const raw = document.getElementById('input-json').value.trim();
      const stateEl = document.getElementById('out-state');
      const sizeEl = document.getElementById('out-size');

      sizeEl.textContent = `${raw.length} chars`;

      if (!raw) {
        stateEl.textContent = "Empty";
        return;
      }

      try {
        JSON.parse(raw);
        stateEl.textContent = "Perfect & Valid";
        stateEl.className = "text-xl font-extrabold mt-2 block text-emerald-400";
      } catch (err) {
        stateEl.textContent = `Invalid: ${err.message}`;
        stateEl.className = "text-xl font-extrabold mt-2 block text-rose-300";
      }
    }

    function beautifyJSON() {
      const raw = document.getElementById('input-json').value;
      const formatted = document.getElementById('out-formatted');
      try {
        const obj = JSON.parse(raw);
        const str = JSON.stringify(obj, null, 2);
        formatted.textContent = str;
        document.getElementById('input-json').value = str;
        validateJSON();
      } catch (err) {
        formatted.textContent = `Formatting failed: ${err.message}`;
      }
    }

    function minifyJSON() {
      const raw = document.getElementById('input-json').value;
      const formatted = document.getElementById('out-formatted');
      try {
        const obj = JSON.parse(raw);
        const str = JSON.stringify(obj);
        formatted.textContent = str;
        document.getElementById('input-json').value = str;
        validateJSON();
      } catch (err) {
        formatted.textContent = `Compression failed: ${err.message}`;
      }
    }

    function copyFormatted() {
      const btn = document.getElementById('btn-copy');
      const text = btn.querySelector('span');
      const code = document.getElementById('out-formatted').textContent;
      navigator.clipboard.writeText(code).then(() => {
        text.textContent = 'Copied!';
        setTimeout(() => { text.textContent = 'Copy Code'; }, 2000);
      });
    }

    window.addEventListener('DOMContentLoaded', validateJSON);
  </script>
  <footer id="global-footer"></footer>
  <script src="../global.js"></script>
</body>
</html>
