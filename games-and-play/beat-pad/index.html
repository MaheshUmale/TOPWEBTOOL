  <!-- Early Blocking Theme Loader: Eliminates Light/Dark Flashing/Flickering -->
  <script>
    (function () {
      try {
        const theme = localStorage.getItem("theme");
        if (theme === "dark") {
          document.documentElement.classList.add("dark");
          document.documentElement.classList.remove("light");
        } else {
          document.documentElement.classList.remove("dark");
          document.documentElement.classList.add("light");
        }
      } catch (e) {}
    })();
  </script>

    .pad { aspect-ratio: 1; border-radius: 16px; border: 2px solid #e2e8f0; background: #f8fafc; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; transition: transform 80ms ease-out, background-color 80ms ease-out, border-color 80ms ease-out, box-shadow 80ms ease-out; user-select: none; -webkit-tap-highlight-color: transparent; touch-action: manipulation; min-width: 48px; min-height: 48px; }

<body>

          <h1 class="text-3xl font-extrabold text-slate-900 dark:text-white tracking-tight">Beat Pad</h1>
          <p class="mt-2 text-base text-slate-500 dark:text-slate-400">16-pad drum machine with synthesized percussion. Tap pads or use your keyboard to make beats.</p>
        </div>
        <div class="bg-amber-50 dark:bg-amber-900/20 border border-amber-200 dark:border-amber-800 rounded-xl p-4 mt-4">
          <p class="text-sm text-amber-800 dark:text-amber-200"><strong>How to Play:</strong> Hit pads to trigger sounds. Controls: Keys A-I / Q-I to hit pads. Click or tap pads directly on touch devices.</p>

            </div>

  <script>
(function() {
    const PADS = [
      { key: 'a', name: 'Kick', sound: 'kick' },
      { key: 's', name: 'Snare', sound: 'snare' },
      { key: 'd', name: 'HiHat C', sound: 'hihat-closed' },
      { key: 'f', name: 'HiHat O', sound: 'hihat-open' },
      { key: 'g', name: 'Clap', sound: 'clap' },
      { key: 'h', name: 'Tom Lo', sound: 'tom-low' },
      { key: 'j', name: 'Tom Mid', sound: 'tom-mid' },
      { key: 'k', name: 'Tom Hi', sound: 'tom-hi' },
      { key: 'q', name: 'Crash', sound: 'crash' },
      { key: 'w', name: 'Ride', sound: 'ride' },
      { key: 'e', name: 'Rim', sound: 'rim' },
      { key: 'r', name: 'Shaker', sound: 'shaker' },
      { key: 't', name: 'Cowbell', sound: 'cowbell' },
      { key: 'y', name: 'Zap', sound: 'zap' },
      { key: 'u', name: 'Laser', sound: 'laser' },
      { key: 'i', name: 'Bass', sound: 'bass' }
    ];
    const grid = document.getElementById('padGrid');
    const padEls = {};
    let audioCtx = null;
    let masterGain = null;
    let volume = 0.8;
    try {
      const saved = localStorage.getItem('topwebtool-beatpad');
      if (saved) { const obj = JSON.parse(saved); if (typeof obj.volume === 'number') volume = Math.max(0, Math.min(1, obj.volume)); }
    } catch(e){}
    document.getElementById('volume').value = Math.round(volume * 100);
    document.getElementById('volumeLabel').textContent = Math.round(volume * 100) + '%';
    function getAudio() {
      if (!audioCtx) { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); masterGain = audioCtx.createGain(); masterGain.gain.value = volume; masterGain.connect(audioCtx.destination); }
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }
    function setVolume(val) {
      volume = Math.max(0, Math.min(1, val));
      if (masterGain) masterGain.gain.value = volume;
      document.getElementById('volumeLabel').textContent = Math.round(volume * 100) + '%';
      try { localStorage.setItem('topwebtool-beatpad', JSON.stringify({ volume })); } catch(e){}
    }
    document.getElementById('volume').addEventListener('input', (e) => setVolume(parseInt(e.target.value) / 100));
    function noise(ctx, dur) {
      const buf = ctx.createBuffer(1, ctx.sampleRate * dur, ctx.sampleRate);
      const data = buf.getChannelData(0);
      for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
      const src = ctx.createBufferSource(); src.buffer = buf;
      return src;
    }
    function playSound(type) {
      const ctx = getAudio();
      const now = ctx.currentTime;
      switch(type) {
        case 'kick': {
          const osc = ctx.createOscillator(); const g = ctx.createGain();
          osc.type = 'sine'; osc.frequency.setValueAtTime(150, now); osc.frequency.exponentialRampToValueAtTime(30, now + 0.15);
          g.gain.setValueAtTime(1, now); g.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
          osc.connect(g); g.connect(masterGain); osc.start(now); osc.stop(now + 0.3); break;
        }
        case 'snare': {
          const n = noise(ctx, 0.2); const nf = ctx.createBiquadFilter(); nf.type = 'highpass'; nf.frequency.value = 1000;
          const ng = ctx.createGain(); ng.gain.setValueAtTime(0.8, now); ng.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
          n.connect(nf); nf.connect(ng); ng.connect(masterGain); n.start(now); n.stop(now + 0.2);
          const osc = ctx.createOscillator(); const og = ctx.createGain(); osc.type = 'triangle'; osc.frequency.setValueAtTime(180, now); osc.frequency.exponentialRampToValueAtTime(80, now + 0.1);
          og.gain.setValueAtTime(0.7, now); og.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
          osc.connect(og); og.connect(masterGain); osc.start(now); osc.stop(now + 0.1); break;
        }
        case 'hihat-closed': {
          const n = noise(ctx, 0.05); const f = ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 7000;
          const g = ctx.createGain(); g.gain.setValueAtTime(0.4, now); g.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
          n.connect(f); f.connect(g); g.connect(masterGain); n.start(now); n.stop(now + 0.05); break;
        }
        case 'hihat-open': {
          const n = noise(ctx, 0.3); const f = ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 6000;
          const g = ctx.createGain(); g.gain.setValueAtTime(0.4, now); g.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
          n.connect(f); f.connect(g); g.connect(masterGain); n.start(now); n.stop(now + 0.3); break;
        }
        case 'clap': {
          const n = noise(ctx, 0.15); const f = ctx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 1200; f.Q.value = 1;
          const g = ctx.createGain(); g.gain.setValueAtTime(0, now); g.gain.setValueAtTime(0.9, now + 0.01); g.gain.setValueAtTime(0.5, now + 0.02); g.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
          n.connect(f); f.connect(g); g.connect(masterGain); n.start(now); n.stop(now + 0.15); break;
        }
        case 'tom-low': {
          const osc = ctx.createOscillator(); const g = ctx.createGain(); osc.type = 'sine'; osc.frequency.setValueAtTime(120, now); osc.frequency.exponentialRampToValueAtTime(50, now + 0.25);
          g.gain.setValueAtTime(0.9, now); g.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
          osc.connect(g); g.connect(masterGain); osc.start(now); osc.stop(now + 0.3); break;
        }
        case 'tom-mid': {
          const osc = ctx.createOscillator(); const g = ctx.createGain(); osc.type = 'sine'; osc.frequency.setValueAtTime(180, now); osc.frequency.exponentialRampToValueAtTime(80, now + 0.2);
          g.gain.setValueAtTime(0.9, now); g.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
          osc.connect(g); g.connect(masterGain); osc.start(now); osc.stop(now + 0.25); break;
        }
        case 'tom-hi': {
          const osc = ctx.createOscillator(); const g = ctx.createGain(); osc.type = 'sine'; osc.frequency.setValueAtTime(240, now); osc.frequency.exponentialRampToValueAtTime(120, now + 0.15);
          g.gain.setValueAtTime(0.9, now); g.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
          osc.connect(g); g.connect(masterGain); osc.start(now); osc.stop(now + 0.2); break;
        }
        case 'crash': {
          const n = noise(ctx, 0.6); const f = ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 4000;
          const g = ctx.createGain(); g.gain.setValueAtTime(0.5, now); g.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
          n.connect(f); f.connect(g); g.connect(masterGain); n.start(now); n.stop(now + 0.6); break;
        }
        case 'ride': {
          const n = noise(ctx, 0.4); const f = ctx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 8000; f.Q.value = 1;
          const g = ctx.createGain(); g.gain.setValueAtTime(0.35, now); g.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
          n.connect(f); f.connect(g); g.connect(masterGain); n.start(now); n.stop(now + 0.4); break;
        }
        case 'rim': {
          const osc = ctx.createOscillator(); const g = ctx.createGain(); osc.type = 'square'; osc.frequency.setValueAtTime(800, now);
          g.gain.setValueAtTime(0.6, now); g.gain.exponentialRampToValueAtTime(0.001, now + 0.03);
          osc.connect(g); g.connect(masterGain); osc.start(now); osc.stop(now + 0.03); break;
        }
        case 'shaker': {
          const n = noise(ctx, 0.08); const f = ctx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 9000; f.Q.value = 0.5;
          const g = ctx.createGain(); g.gain.setValueAtTime(0.3, now); g.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
          n.connect(f); f.connect(g); g.connect(masterGain); n.start(now); n.stop(now + 0.08); break;
        }
        case 'cowbell': {
          const o1 = ctx.createOscillator(); const o2 = ctx.createOscillator(); const g = ctx.createGain();
          o1.type = 'square'; o1.frequency.value = 560; o2.type = 'square'; o2.frequency.value = 845;
          const f = ctx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 800; f.Q.value = 2;
          g.gain.setValueAtTime(0.5, now); g.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
          o1.connect(f); o2.connect(f); f.connect(g); g.connect(masterGain);
          o1.start(now); o2.start(now); o1.stop(now + 0.25); o2.stop(now + 0.25); break;
        }
        case 'zap': {
          const osc = ctx.createOscillator(); const g = ctx.createGain(); osc.type = 'sawtooth'; osc.frequency.setValueAtTime(1200, now); osc.frequency.exponentialRampToValueAtTime(200, now + 0.2);
          g.gain.setValueAtTime(0.5, now); g.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
          osc.connect(g); g.connect(masterGain); osc.start(now); osc.stop(now + 0.2); break;
        }
        case 'laser': {
          const osc = ctx.createOscillator(); const g = ctx.createGain(); osc.type = 'sawtooth'; osc.frequency.setValueAtTime(800, now); osc.frequency.linearRampToValueAtTime(2000, now + 0.1); osc.frequency.linearRampToValueAtTime(200, now + 0.3);
          g.gain.setValueAtTime(0.4, now); g.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
          osc.connect(g); g.connect(masterGain); osc.start(now); osc.stop(now + 0.3); break;
        }
        case 'bass': {
          const osc = ctx.createOscillator(); const g = ctx.createGain(); osc.type = 'sine'; osc.frequency.setValueAtTime(55, now);
          g.gain.setValueAtTime(0.9, now); g.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
          osc.connect(g); g.connect(masterGain); osc.start(now); osc.stop(now + 0.4); break;
        }
      }
    }
    function triggerPad(pad) {
      playSound(pad.sound);
      const el = padEls[pad.key];
      if (!el) return;
      el.classList.add('active');
      clearTimeout(el._t);
      el._t = setTimeout(() => el.classList.remove('active'), 100);
    }
    PADS.forEach(p => {
      const btn = document.createElement('button');
      btn.className = 'pad';
      btn.innerHTML = `<span class="pad-key">${p.key.toUpperCase()}</span><span class="pad-name">${p.name}</span>`;
      btn.addEventListener('pointerdown', (e) => { e.preventDefault(); triggerPad(p); });
      padEls[p.key] = btn;
      grid.appendChild(btn);
    });
    const keyMap = {};
    PADS.forEach(p => { keyMap[p.key] = p; });
    document.addEventListener('keydown', (e) => {
      const k = e.key.toLowerCase();
      if (k in keyMap) { e.preventDefault(); triggerPad(keyMap[k]); }
    });
  })();
  </script>
