  <!-- Early Blocking Theme Loader: Eliminates Light/Dark Flashing/Flickering -->
  <script>
    (function () {
      try {
        const theme = localStorage.getItem("theme");
        if (theme === "dark") {
          document.documentElement.classList.add("dark");
          document.documentElement.classList.remove("light");
        } else {
          document.documentElement.classList.remove("dark");
          document.documentElement.classList.add("light");
        }
      } catch (e) {}
    })();
  </script>

    .metro-container { max-width: 500px; margin: 0 auto; text-align: center; }
    .metro-display { font-size: 4rem; font-weight: 800; color: #4f46e5; margin: 1rem 0; }
    .dark .metro-display { color: #818cf8; }
    .metro-beats { display: flex; gap: 8px; justify-content: center; margin: 1rem 0; }
    .metro-beat { width: 40px; height: 40px; border-radius: 50%; background: #e2e8f0; transition: all 80ms; }
    .dark .metro-beat { background: #1e293b; }
    .metro-beat.active { background: #4f46e5; transform: scale(1.2); }
    .dark .metro-beat.active { background: #818cf8; }
    .metro-controls { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: center; margin: 1.5rem 0; }

    .metro-controls input[type="range"] { accent-color: #4f46e5; }
    .metro-controls select { padding: 8px 12px; border-radius: 8px; border: 1px solid #e2e8f0; }
    .dark .metro-controls select { background: #0f172a; border-color: #1e293b; color: #f1f5f9; }

<body>
  <header id="global-header"></header>
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
    <div class="grid grid-cols-1 lg:grid-cols-4 gap-4">
      <div class="lg:col-span-3">
        <div class="bg-white dark:bg-slate-900 p-6 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm">
          <h1 class="text-3xl font-extrabold text-slate-900 dark:text-white tracking-tight">Metronome</h1>
          <p class="mt-2 text-base text-slate-500 dark:text-slate-400">Precision online metronome for musicians. Adjust BPM, time signature, and sound.</p>
        </div>
        <div class="bg-amber-50 dark:bg-amber-900/20 border border-amber-200 dark:border-amber-800 rounded-xl p-4 mt-4">
          <p class="text-sm text-amber-800 dark:text-amber-200"><strong>How to Play:</strong> Objective: Practice with a steady beat. Controls: Set BPM and time signature, then press Start. Tap tempo to find BPM by clicking repeatedly.</p>
        </div>
        <div class="bg-white dark:bg-slate-900 p-6 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm mt-4">
          <div class="metro-container">
            <div class="metro-display" id="bpmDisplay">120</div>
            <div class="metro-beats" id="beats"></div>
            <div class="metro-controls">
              <label>BPM: <input type="range" id="bpm" min="30" max="240" value="120" style="width:150px;" oninput="updateBPM()"></label>
              <label>Beats: <select id="beats" onchange="renderBeats()"><option>2</option><option>3</option><option selected>4</option><option>5</option><option>6</option><option>7</option></select></label>
              <label>Sound: <select id="sound"><option>click</option><option>beep</option><option>wood</option></select></label>
            </div>
            <div class="game-controls">
              <button class="btn btn-primary" id="startBtn" onclick="toggleMetronome()">Start</button>
              <button class="btn btn-secondary" onclick="tapTempo()">Tap Tempo</button>
            </div>
          </div>
        </div>
      </div>
      <div class="lg:col-span-1"><div id="trending-sidebar"></div></div>
    </div>

  <script src="../../global.js" defer></script>
  <script src="../../twt-shell.js" defer></script>
  <script src="../../js/context-engine.js" defer></script>
  <script>
    let bpm = 120, playing = false, interval = null, currentBeat = 0, beatCount = 4, lastTap = 0, tapTimes = [];
    function updateBPM() { bpm = parseInt(document.getElementById('bpm').value); document.getElementById('bpmDisplay').textContent = bpm; if (playing) { clearInterval(interval); interval = setInterval(tick, 60000 / bpm); } }
    function renderBeats() { beatCount = parseInt(document.getElementById('beats').value); currentBeat = 0; const container = document.getElementById('beats'); container.innerHTML = ''; for (let i = 0; i < beatCount; i++) { const beat = document.createElement('div'); beat.className = 'metro-beat'; beat.id = 'beat-' + i; container.appendChild(beat); } }
    function tick() { const beats = document.querySelectorAll('.metro-beat'); beats.forEach(b => b.classList.remove('active')); const beat = document.getElementById('beat-' + currentBeat); if (beat) beat.classList.add('active'); playClick(currentBeat === 0); currentBeat = (currentBeat + 1) % beatCount; }
    function toggleMetronome() { playing = !playing; const btn = document.getElementById('startBtn'); if (playing) { btn.textContent = 'Stop'; interval = setInterval(tick, 60000 / bpm); } else { btn.textContent = 'Start'; clearInterval(interval); } }
    function tapTempo() { const now = Date.now(); tapTimes.push(now); if (tapTimes.length > 5) tapTimes.shift(); if (tapTimes.length > 1) { const intervals = []; for (let i = 1; i < tapTimes.length; i++) intervals.push(tapTimes[i] - tapTimes[i-1]); const avg = intervals.reduce((a,b)=>a+b,0) / intervals.length; bpm = Math.round(60000 / avg); bpm = Math.max(30, Math.min(240, bpm)); document.getElementById('bpm').value = bpm; updateBPM(); } }
    function playClick(downbeat) { try { const ctx = new (window.AudioContext || window.webkitAudioContext)(); const osc = ctx.createOscillator(); const g = ctx.createGain(); const type = document.getElementById('sound').value; osc.type = type === 'wood' ? 'sine' : 'square'; osc.frequency.setValueAtTime(downbeat ? 1000 : 800, ctx.currentTime); g.gain.setValueAtTime(0.1, ctx.currentTime); g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.05); osc.connect(g); g.connect(ctx.destination); osc.start(); osc.stop(ctx.currentTime + 0.05); } catch(e){} }
    renderBeats();
  </script>
