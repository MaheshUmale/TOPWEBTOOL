  <style>
    .whack-container { max-width: 500px; margin: 0 auto; }
    .whack-header { text-align: center; margin-bottom: 1.5rem; }
    .whack-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
    .hole { position: relative; aspect-ratio: 1; background: #1e293b; border-radius: 16px; overflow: hidden; cursor: pointer; border: 2px solid #334155; transition: border-color 150ms; }
    .hole:hover { border-color: #4f46e5; }
    .mole { position: absolute; bottom: -100%; left: 50%; transform: translateX(-50%); font-size: 3rem; transition: bottom 200ms ease-out; user-select: none; }
    .hole.active .mole { bottom: 10%; }
    .hole.whacked .mole { bottom: -100%; transition: bottom 100ms ease-in; }
    .whack-stats { display: flex; justify-content: center; gap: 2rem; margin: 1.5rem 0; flex-wrap: wrap; }
    .whack-stat { text-align: center; }
    .whack-stat-value { font-size: 1.5rem; font-weight: 800; color: #4f46e5; }
    .dark .whack-stat-value { color: #818cf8; }
    .whack-stat-label { font-size: 0.75rem; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.05em; }
    .combo-popup { position: fixed; top: 20%; left: 50%; transform: translateX(-50%); font-size: 2rem; font-weight: 800; color: #fbbf24; text-shadow: 0 2px 10px rgba(0,0,0,0.3); pointer-events: none; opacity: 0; transition: opacity 300ms; z-index: 50; }
    .combo-popup.show { opacity: 1; }
    .game-controls { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 1.5rem; }
    .btn { padding: 10px 24px; border-radius: 12px; font-weight: 600; font-size: 0.875rem; border: none; cursor: pointer; transition: all 150ms ease; }
    .btn-primary { background: #4f46e5; color: white; }
    .btn-primary:hover { background: #4338ca; }
    .btn-secondary { background: #f1f5f9; color: #475569; }
    .dark .btn-secondary { background: #1e293b; color: #94a3b8; }
  </style>
</head>
<body>
  <header id="global-header"></header>
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
    <div class="grid grid-cols-1 lg:grid-cols-4 gap-4">
      <div class="lg:col-span-3">
        <div class="bg-white dark:bg-slate-900 p-6 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm">
          <h1 class="text-3xl font-extrabold text-slate-900 dark:text-white tracking-tight">Whack A Mole</h1>
          <p class="mt-2 text-base text-slate-500 dark:text-slate-400">Test your reflexes! Click the moles before they disappear. Build combos for bonus points.</p>
        </div>
        <div class="bg-amber-50 dark:bg-amber-900/20 border border-amber-200 dark:border-amber-800 rounded-xl p-4 mt-4">
          <p class="text-sm text-amber-800 dark:text-amber-200"><strong>How to Play:</strong> Objective: Click moles as they appear. Build combos for bonus points. Controls: Mouse/Touch to whack.</p>
        </div>
        <div class="bg-white dark:bg-slate-900 p-6 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm mt-4">
          <div class="whack-container">
            <div class="whack-stats">
              <div class="whack-stat"><div class="whack-stat-value" id="score">0</div><div class="whack-stat-label">Score</div></div>
              <div class="whack-stat"><div class="whack-stat-value" id="combo">x1</div><div class="whack-stat-label">Combo</div></div>
              <div class="whack-stat"><div class="whack-stat-value" id="best">0</div><div class="whack-stat-label">Best</div></div>
            </div>
            <div class="whack-grid" id="grid"></div>
            <div class="game-controls">
              <button class="btn btn-primary" id="startBtn" onclick="startGame()">Start Game</button>
              <button class="btn btn-secondary" id="stopBtn" onclick="stopGame()" style="display:none;">Stop</button>
            </div>
          </div>
        </div>
      </div>
      <div class="lg:col-span-1"><div id="trending-sidebar"></div></div>
    </div>
  </main>
  <div class="combo-popup" id="comboPopup"></div>
  <footer id="global-footer"></footer>
  <script src="../../global.js" defer></script>
  <script src="../../twt-shell.js" defer></script>
  <script src="../../js/context-engine.js" defer></script>
  <script>
    const grid = document.getElementById('grid');
    const scoreEl = document.getElementById('score');
    const comboEl = document.getElementById('combo');
    const bestEl = document.getElementById('best');
    const startBtn = document.getElementById('startBtn');
    const comboPopup = document.getElementById('comboPopup');
    let holes = [];
    let score = 0;
    let combo = 1;
    let best = 0;
    let gameRunning = false;
    let moleTimer = null;
    let showTime = 800;
    let lastHit = 0;
    try { best = parseInt(localStorage.getItem('topwebtool-whack')?.highScore) || 0; bestEl.textContent = best; } catch(e){}
    function initGrid() {
      grid.innerHTML = '';
      holes = [];
      for (let i = 0; i < 9; i++) {
        const hole = document.createElement('div');
        hole.className = 'hole';
        hole.dataset.index = i;
        hole.innerHTML = '<div class="mole">🐹</div>';
        hole.addEventListener('mousedown', (e) => { e.preventDefault(); whack(i); });
        hole.addEventListener('touchstart', (e) => { e.preventDefault(); whack(i); });
        grid.appendChild(hole);
        holes.push(hole);
      }
    }
    function startGame() {
      if (gameRunning) return;
      gameRunning = true;
      score = 0; combo = 1; showTime = 800;
      scoreEl.textContent = '0'; comboEl.textContent = 'x1';
      startBtn.textContent = 'Playing...';
      startBtn.disabled = true;
      document.getElementById('stopBtn').style.display = 'inline-flex';
      nextMole();
    }
    function stopGame() {
      gameRunning = false;
      clearTimeout(moleTimer);
      holes.forEach(h => { h.classList.remove('active'); h.classList.remove('whacked'); });
      startBtn.textContent = 'Start Game';
      startBtn.disabled = false;
      document.getElementById('stopBtn').style.display = 'none';
      playBeep(400, 'sine', 0.15);
    }
    function nextMole() {
      if (!gameRunning) return;
      clearTimeout(moleTimer);
      holes.forEach(h => { h.classList.remove('active'); h.classList.remove('whacked'); });
      const idx = Math.floor(Math.random() * 9);
      holes[idx].classList.add('active');
      moleTimer = setTimeout(() => {
        holes[idx].classList.remove('active');
        if (gameRunning) nextMole();
      }, showTime);
    }
    function whack(idx) {
      if (!gameRunning) return;
      const hole = holes[idx];
      if (!hole.classList.contains('active')) return;
      hole.classList.add('whacked');
      hole.classList.remove('active');
      const now = Date.now();
      if (now - lastHit < 1500) { combo = Math.min(combo + 1, 10); } else { combo = 1; }
      lastHit = now;
      const points = 10 * combo;
      score += points;
      scoreEl.textContent = score;
      comboEl.textContent = 'x' + combo;
      showCombo(combo);
      playBeep(600 + combo * 50, 'sine', 0.1);
      if (score > best) { best = score; bestEl.textContent = best; try { localStorage.setItem('topwebtool-whack', JSON.stringify({ highScore: best, comboBest: Math.max(combo, best) })); } catch(e){} }
      showTime = Math.max(300, 800 - Math.floor(score / 100) * 50);
    }
    function showCombo(c) {
      if (c < 2) return;
      comboPopup.textContent = c + 'x COMBO!';
      comboPopup.classList.add('show');
      setTimeout(() => comboPopup.classList.remove('show'), 800);
    }
    function playBeep(freq, type, dur) {
      try { const ctx = new (window.AudioContext || window.webkitAudioContext)(); const osc = ctx.createOscillator(); const g = ctx.createGain(); osc.type = type; osc.frequency.setValueAtTime(freq, ctx.currentTime); g.gain.setValueAtTime(0.1, ctx.currentTime); g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur); osc.connect(g); g.connect(ctx.destination); osc.start(); osc.stop(ctx.currentTime + dur); } catch(e){}
    }
    initGrid();
  </script>
</body>
