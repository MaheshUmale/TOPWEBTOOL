    (function () {
      try {
        const theme = localStorage.getItem("theme");
        if (theme === "dark") {
          document.documentElement.classList.add("dark");
          document.documentElement.classList.remove("light");
        } else {
          document.documentElement.classList.remove("dark");
          document.documentElement.classList.add("light");
        }
      } catch (e) {}
    })();
  </script>

    .kalimba-container { max-width: 720px; margin: 0 auto; }
    .kalimba-board {
      background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
      border-radius: 24px;
      padding: 2rem 1.5rem 1.5rem;
      border: 2px solid #334155;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.05);
      position: relative;
      overflow: hidden;
    }
    .kalimba-board::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; height: 40%;
      background: linear-gradient(180deg, rgba(255,255,255,0.03) 0%, transparent 100%);
      pointer-events: none;
    }
    .tines-row {
      display: flex;
      justify-content: center;
      align-items: flex-end;
      gap: 12px;
      height: 280px;
      padding: 0 0.5rem;
    }
    .tine-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .tine {
      width: 14px;
      border-radius: 7px 7px 3px 3px;
      background: linear-gradient(180deg, #f8fafc 0%, #cbd5e1 60%, #94a3b8 100%);
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3), inset 0 2px 4px rgba(255,255,255,0.6);
      cursor: pointer;
      touch-action: manipulation;
      transition: background 150ms, box-shadow 150ms;
      position: relative;
    }
    .tine.plucked {
      animation: wiggle 0.35s ease-out;
      box-shadow: 0 0 20px rgba(251, 191, 36, 0.6), 0 0 40px rgba(251, 191, 36, 0.3), 0 4px 6px -1px rgba(0,0,0,0.3);
    }
    @keyframes wiggle {
      0% { transform: rotate(0deg) scale(1); }
      15% { transform: rotate(6deg) scale(1.05); }
      30% { transform: rotate(-5deg) scale(1.03); }
      45% { transform: rotate(4deg) scale(1.02); }
      60% { transform: rotate(-2deg) scale(1.01); }
      75% { transform: rotate(1deg) scale(1); }
      100% { transform: rotate(0deg) scale(1); }
    }
    .tine-key {
      font-size: 0.75rem;
      font-weight: 700;
      color: #94a3b8;
      background: rgba(15,23,42,0.6);
      border-radius: 6px;

  <script>
(function() {
    const notes = [
      { name: 'C4', freq: 261.63, key: 'a', height: 240 },
      { name: 'D4', freq: 293.66, key: 's', height: 220 },
      { name: 'E4', freq: 329.63, key: 'd', height: 200 },
      { name: 'F4', freq: 349.23, key: 'f', height: 185 },
      { name: 'G4', freq: 392.00, key: 'g', height: 170 },
      { name: 'A4', freq: 440.00, key: 'h', height: 155 },
      { name: 'B4', freq: 493.88, key: 'j', height: 140 },
      { name: 'C5', freq: 523.25, key: 'k', height: 125 }
    ];
    const tinesRow = document.getElementById('tinesRow');
    const volumeInput = document.getElementById('volume');
    let volume = 0.5;
    try {
      const stored = localStorage.getItem('topwebtool-kalimba');
      if (stored) { const p = JSON.parse(stored); if (typeof p.volume === 'number') volume = p.volume; }
    } catch(e){}
    volumeInput.value = volume;
    function saveVolume() {
      try { localStorage.setItem('topwebtool-kalimba', JSON.stringify({ volume })); } catch(e){}
    }
    volumeInput.addEventListener('input', () => { volume = parseFloat(volumeInput.value); saveVolume(); });
    function buildTines() {
      notes.forEach((note, i) => {
        const wrapper = document.createElement('div');
        wrapper.className = 'tine-wrapper';
        const tine = document.createElement('div');
        tine.className = 'tine';
        tine.style.height = note.height + 'px';
        tine.dataset.index = i;
        const keyLabel = document.createElement('div');
        keyLabel.className = 'tine-key';
        keyLabel.textContent = note.key.toUpperCase();
        const noteLabel = document.createElement('div');
        noteLabel.className = 'tine-note';
        noteLabel.textContent = note.name;
        wrapper.appendChild(tine);
        wrapper.appendChild(keyLabel);
        wrapper.appendChild(noteLabel);
        tinesRow.appendChild(wrapper);
        const pluck = () => playNote(i);
        tine.addEventListener('mousedown', pluck);
        tine.addEventListener('touchstart', (e) => { e.preventDefault(); pluck(); }, { passive: false });
      });
    }
    let audioCtx = null;
    function getAudioCtx() {
      if (!audioCtx) {
        try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){ audioCtx = null; }
      }
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }
    function playNote(index) {
      const ctx = getAudioCtx();
      if (!ctx) return;
      const note = notes[index];
      const now = ctx.currentTime;
      const gain = ctx.createGain();
      gain.gain.setValueAtTime(volume * 0.8, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 1.2);
      const osc = ctx.createOscillator();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(note.freq, now);
      const osc2 = ctx.createOscillator();
      osc2.type = 'sine';
      osc2.frequency.setValueAtTime(note.freq * 2, now);
      const g2 = ctx.createGain();
      g2.gain.setValueAtTime(volume * 0.15, now);
      g2.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
      osc.connect(gain);
      osc2.connect(g2);
      gain.connect(ctx.destination);
      g2.connect(ctx.destination);
      osc.start(now);
      osc.stop(now + 1.2);
      osc2.start(now);
      osc2.stop(now + 0.4);
      const tine = tinesRow.children[index]?.querySelector('.tine');
      if (tine) {
        tine.classList.remove('plucked');
        void tine.offsetWidth;
        tine.classList.add('plucked');
      }
    }
    const keyMap = {};
    notes.forEach((n, i) => { keyMap[n.key] = i; });
    document.addEventListener('keydown', (e) => {
      const k = e.key.toLowerCase();
      if (k in keyMap) { e.preventDefault(); playNote(keyMap[k]); }
    });
    buildTines();
  })();
  </script>
