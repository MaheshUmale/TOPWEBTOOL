    .ukulele-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; flex-wrap: wrap; gap: 0.5rem; }

<body>
  <header id="global-header"></header>
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
    <div class="grid grid-cols-1 lg:grid-cols-4 gap-4">
      <div class="lg:col-span-3">

          <h1 class="text-3xl font-extrabold text-slate-900 dark:text-white tracking-tight">Ukulele</h1>
          <p class="mt-2 text-base text-slate-500 dark:text-slate-400">Play the ukulele with your keyboard or by tapping the strings. Standard GCEA tuning.</p>
        </div>

                <div class="ukulele-chord" id="chordDisplay"></div>

  <script>
    const canvas = document.getElementById('ukuleleCanvas');
    const ctx = canvas.getContext('2d');
    const chordDisplay = document.getElementById('chordDisplay');
    const volumeSlider = document.getElementById('volumeSlider');
    const storageKey = 'topwebtool-ukulele';
    const strings = [
      { key: 'a', freq: 392.00, label: 'G4', color: '#fbbf24', glow: '#f59e0b', vibration: 0 },
      { key: 's', freq: 261.63, label: 'C4', color: '#fbbf24', glow: '#f59e0b', vibration: 0 },
      { key: 'd', freq: 329.63, label: 'E4', color: '#fbbf24', glow: '#f59e0b', vibration: 0 },
      { key: 'f', freq: 440.00, label: 'A4', color: '#fbbf24', glow: '#f59e0b', vibration: 0 }
    ];
    let volume = 80;
    let activeKeys = new Set();
    let audioCtx = null;
    let repeatIntervals = {};
    const chordMap = {
      'a': 'C',
      'd': 'F',
      'f': 'G',
      'a,s': 'Am',
      's,d': 'Dm',
      's,f': 'Em',
      'd,f': 'G7',
      'a,d': 'F',
      'a,f': 'G',
      's,d,f': 'G',
      'a,s,d': 'Dm7',
      'a,s,f': 'C',
      'a,d,f': 'G7',
      'a,s,d,f': 'C'
    };

    try {
      const data = JSON.parse(localStorage.getItem(storageKey) || '{}');
      if (typeof data.volume === 'number') volume = Math.min(100, Math.max(0, data.volume));
    } catch(e){}
    volumeSlider.value = volume;
    volumeSlider.addEventListener('input', () => {
      volume = parseInt(volumeSlider.value);
      try { localStorage.setItem(storageKey, JSON.stringify({ volume })); } catch(e){}
    });

    function getAudioCtx() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    function playTone(freq, vol) {
      try {
        const ctx = getAudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, ctx.currentTime);
        const amp = (vol / 100) * 0.15;
        gain.gain.setValueAtTime(amp, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.6);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.6);
      } catch(e){}
    }

    function pluckString(index) {
      const s = strings[index];
      s.vibration = 1;
      playTone(s.freq, volume);
      updateChord();
    }

    function updateChord() {
      const pressed = [];
      for (const k of activeKeys) pressed.push(k);
      pressed.sort();
      const key = pressed.join(',');
      chordDisplay.textContent = chordMap[key] || '';
    }

    function getStringY(index) {
      return 60 + index * 60;
    }

    function draw() {
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      const nutWidth = 40;
      ctx.fillStyle = '#334155';
      ctx.fillRect(0, 20, nutWidth, canvas.height - 40);
      ctx.fillStyle = '#475569';
      ctx.fillRect(nutWidth - 4, 20, 4, canvas.height - 40);

      strings.forEach((s, i) => {
        const y = getStringY(i);
        if (s.vibration > 0.01) {
          ctx.strokeStyle = s.glow;
          ctx.lineWidth = 4;
          ctx.shadowColor = s.glow;
          ctx.shadowBlur = 15;
          ctx.beginPath();
          const amplitude = 8 * s.vibration;
          const freq = 0.08;
          for (let x = nutWidth; x < canvas.width; x += 5) {
            const dy = Math.sin((x - nutWidth) * freq + performance.now() * 0.05) * amplitude * (1 - (x - nutWidth) / (canvas.width - nutWidth));
            if (x === nutWidth) ctx.moveTo(x, y + dy);
            else ctx.lineTo(x, y + dy);
          }
          ctx.stroke();
          ctx.shadowBlur = 0;
          s.vibration *= 0.95;
        } else {
          ctx.strokeStyle = s.color;
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(nutWidth, y);
          ctx.lineTo(canvas.width, y);
          ctx.stroke();
          s.vibration = 0;
        }

        if (activeKeys.has(s.key)) {
          const fretX = nutWidth + 50 + Math.random() * 100;
          ctx.fillStyle = s.glow;
          ctx.shadowColor = s.glow;
          ctx.shadowBlur = 20;
          ctx.beginPath();
          ctx.arc(fretX, y, 10, 0, Math.PI * 2);
          ctx.fill();
          ctx.shadowBlur = 0;
        }
      });

      requestAnimationFrame(draw);
    }

    function handlePluck(key) {
      const idx = strings.findIndex(s => s.key === key);
      if (idx >= 0) pluckString(idx);
    }

    document.addEventListener('keydown', (e) => {
      const key = e.key.toLowerCase();
      if (strings.some(s => s.key === key)) {
        e.preventDefault();
        if (!activeKeys.has(key)) {
          activeKeys.add(key);
          handlePluck(key);
          repeatIntervals[key] = setInterval(() => handlePluck(key), 180);
        }
      }
    });

    document.addEventListener('keyup', (e) => {
      const key = e.key.toLowerCase();
      if (strings.some(s => s.key === key)) {
        e.preventDefault();
        activeKeys.delete(key);
        clearInterval(repeatIntervals[key]);
        delete repeatIntervals[key];
        updateChord();
      }
    });

    canvas.addEventListener('mousedown', (e) => {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      const x = (e.clientX - rect.left) * scaleX;
      const y = (e.clientY - rect.top) * scaleY;
      for (let i = 0; i < strings.length; i++) {
        const sy = getStringY(i);
        if (Math.abs(y - sy) < 30 && x > 40) {
          pluckString(i);
          break;
        }
      }
    });

    canvas.addEventListener('touchstart', (e) => {
      e.preventDefault();
      const touch = e.touches[0];
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      const x = (touch.clientX - rect.left) * scaleX;
      const y = (touch.clientY - rect.top) * scaleY;
      for (let i = 0; i < strings.length; i++) {
        const sy = getStringY(i);
        if (Math.abs(y - sy) < 40 && x > 40) {
          pluckString(i);
          break;
        }
      }
    }, { passive: false });

    window.addEventListener('blur', () => {
      strings.forEach((s, i) => {
        activeKeys.delete(s.key);
        clearInterval(repeatIntervals[s.key]);
        delete repeatIntervals[s.key];
      });
      updateChord();
    });

    draw();
  </script>
</body>
