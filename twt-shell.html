<!doctype html>
<!--
  ============================================================================
  TopWebTool GLOBAL BOILERPLATE WRAPPER — reference template
  ============================================================================
  This is the single source of truth for the premium uniform framework.
  Map any of the 83 existing tool/article pages into it by following the
  class contract below. The engine (`twt-shell.js`) auto-wraps any page
  that matches this skeleton — no tool JS is ever touched.

  STRUCTURAL CLASS CONTRACT
  ----------------------------------------------------------------------------
  body.twt-shell                      → enables the framework + theme hooks
  header#global-header                → sticky top chrome (rendered by global.js)
  .twt-shell__frame                   → grid: nav | workspace | rail  (auto)
    .twt-shell__nav                   → LEFT NAV SIDEBAR (desktop ≥1200px)
    main.twt-shell__workspace         → CENTER WORKSPACE + SEO CONTENT
      #ad-slot-a                      → TOP BANNER   (min-height 90px)
      .twt-tool                       → THE TOOL WIDGET (existing markup)
      #ad-slot-square (auto-promoted) → MID-INLINE   (min-height 250px, auto)
      #seo-instructional-hub / article → SEO ARTICLE COPY (.twt-prose typography)
    .twt-shell__rail                  → RIGHT STICKY AD RAIL (≥768px)
      #trending-sidebar (auto-moved)  → searchable utility panel (tablet split-pane)
      #ad-slot-vertical               → SKYSCRAPER 300x600 (desktop only)
  footer#global-footer                → bottom chrome (rendered by global.js)

  AUTO-REARRANGEMENT (engine reparents, never clones/duplicates)
  ----------------------------------------------------------------------------
  1. `#trending-sidebar` panel        → moved whole into the rail (search intact)
  2. `#ad-slot-square` (250px)        → becomes the mid-inline unit, inserted
                                        between the tool widget and SEO content
  3. `#ad-slot-vertical` (300x600)    → becomes the rail skyscraper
  4. Legacy `lg:grid-cols-4` wrapper  → neutralized; sidebar column hidden so the
                                        workspace is one full-width column
  5. Fallback (no trending panel)     → engine injects `.twt-rail__links` with
                                        the first 12 registry tools

  RESPONSIVE MATRIX
  ----------------------------------------------------------------------------
  <768px      single-column dashboard, inputs forced to 16px (no iOS zoom)
  768–1199px  dual split-pane: workspace + rail (utility panel; no skyscraper)
  ≥1200px     3-column execution engine, max-width 1400px, rail + nav sticky

  ASSET INGESTION (add to every mapped page)
  ----------------------------------------------------------------------------
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="../styles.css">
    <link rel="stylesheet" href="../site.min.css">
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap">
      <link rel="stylesheet" href="../styles.css">
      <link rel="stylesheet" href="../site.min.css">
    </noscript>
  <script src="../twt-shell.js" defer></script>
  (then load ORDER: styles.css → site.min.css;
   scripts: global.js → twt-shell.js, both defer)
  ============================================================================
-->
<html lang="en">
  <head>
    <!-- Early Blocking Theme Loader: Eliminates Light/Dark Flashing/Flickering -->
    <script>
      (function () {
        try {
          const theme = localStorage.getItem("theme");
          if (theme === "dark") {
            document.documentElement.classList.add("dark");
            document.documentElement.classList.remove("light");
          } else {
            document.documentElement.classList.remove("dark");
            document.documentElement.classList.add("light");
          }
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        
    
    <meta charset="UTF-8" />
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- @TODO: replace per tool -->
    <title>Tool Name | TopWebTool</title>
    <meta name="description" content="Tool description for SEO — replace me." />
    <link rel="canonical" href="https://topwebtool.com/tool-name/" />

    <link rel="icon" type="image/svg+xml" href="../favicon.svg" />
    <link rel="apple-touch-icon" href="../apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="../favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="../favicon-16x16.png" />
    <link rel="manifest" href="../site.webmanifest" />
    <meta name="theme-color" content="#090d16" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="TopWebTool" />
    <meta property="og:title" content="Tool Name | TopWebTool" />
    <meta property="og:description" content="Tool description for SEO — replace me." />
    <meta property="og:url" content="https://topwebtool.com/tool-name/" />
    <meta property="og:image" content="https://topwebtool.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Tool Name | TopWebTool" />
    <meta name="twitter:description" content="Tool description for SEO — replace me." />
    <meta name="twitter:image" content="https://topwebtool.com/og-image.png" />

    <!-- JSON-LD: WebApplication -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Tool Name | TopWebTool",
        "url": "https://topwebtool.com/tool-name/",
        "applicationCategory": "UtilityApplication",
        "operatingSystem": "Windows, macOS, Linux, Android, iOS",
        "browserRequirements": "Requires HTML5 compatible web browser",
        "description": "Tool description for SEO — replace me.",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
      }
    </script>

    <!-- JSON-LD: BreadcrumbList -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "BreadcrumbList",
        "itemListElement": [
          {
            "@type": "ListItem",
            "position": 1,
            "name": "Home",
            "item": "https://topwebtool.com/"
          },
          {
            "@type": "ListItem",
            "position": 2,
            "name": "Tool Name",
            "item": "https://topwebtool.com/tool-name/"
          }
        ]
      }
    </script>

    <!-- Asset ingestion order matters: Tailwind → global → core framework -->
    
    
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="../styles.css">
    <link rel="stylesheet" href="../site.min.css">
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap">
      <link rel="stylesheet" href="../styles.css">
      <link rel="stylesheet" href="../site.min.css">
    </noscript>
      <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3901061173891576" crossorigin="anonymous"></script>
  </head>

  <!-- The `.twt-shell` body class engages the framework. -->
  <body
    class="twt-shell bg-white dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen flex flex-col"
  >
    <!-- Top chrome (auto-rendered by global.js into this slot) -->
    <header id="global-header"></header>

    <!--
      CENTER WORKSPACE
      `twt-shell.js` lifts this <main> into .twt-shell__frame as the
      center column and builds the left nav + right rail automatically.
      If you prefer static markup, pre-declare .twt-shell__frame and set
      <main class="twt-shell__workspace"> yourself.
    -->
    <main class="twt-shell__workspace max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex-grow">
      <!-- TOP BANNER — zero-CLS: 90px reserved before the ad script runs -->
      <div></div>

      <!-- TOOL WIDGET — the existing tool markup drops in here untouched -->
      <section class="twt-card" aria-labelledby="tool-heading">
        <h1 id="tool-heading" class="twt-h1">Tool Name</h1>
        <p class="twt-lead">One-line description of what this utility computes.</p>

        <!-- Paste the existing tool's <form> / widgets here verbatim.
             Inputs/selects inherit the 16px anti-zoom invariant from the core CSS. -->
        <form class="twt-field" onsubmit="return false;">
          <label class="twt-label" for="sample-input">Sample Input</label>
          <input id="sample-input" class="twt-input" type="text" placeholder="Enter a value" />
          <button type="submit" class="twt-btn twt-btn--primary">Run Tool</button>
        </form>
      </section>

      <!-- MID-INLINE AD — zero-CLS: 250px reserved before the ad script runs -->
      <div></div>

      <!-- SEO CONTENT — long-form copy uses the .twt-prose type scale -->
      <section class="twt-seo-content">
        <article class="twt-prose">
          <h2>How this tool works</h2>
          <p>
            Replace with the tool's evergreen SEO explanation. Headings, lists,
            tables, quotes, and code blocks are all styled by the framework.
          </p>
          <ul>
            <li>Point one</li>
            <li>Point two</li>
            <li>Point three</li>
          </ul>
        </article>
      </section>
    </main>

    <!-- Bottom chrome (auto-rendered by global.js into this slot) -->
    <footer id="global-footer"></footer>

    <!-- Ingestion order matters: global.js first, then the shell engine -->
    <script src="../global.js" defer></script>
    <script src="../twt-shell.js" defer></script>
    <script src="../js/context-engine.js" defer></script>
  </body>
</html>
