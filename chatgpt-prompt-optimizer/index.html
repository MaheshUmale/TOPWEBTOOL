          <p class="mt-2 text-base text-slate-500">
            Augment raw prompts. Inject system roles, custom styling parameters, and strict output instructions to retrieve top-tier responses.

                <select id="input-persona" class="block w-full px-3 py-2.5 border border-slate-300 rounded-lg bg-white font-semibold text-sm text-slate-950" onchange="optimizePrompt()">

                  <option value="Professional Email Structure" selected>Professional Email Structure</option>
                  <option value="Markdown Block with clear headings">Markdown Block with headings</option>

  <!-- AD C REMOVED -->

  <script>
    function optimizePrompt() {
      const raw = document.getElementById('input-raw').value.trim();
      const persona = document.getElementById('input-persona').value;
      const format = document.getElementById('input-format').value;
      const tone = document.getElementById('input-tone').value;

      if (!raw) {
        document.getElementById('out-optimized').textContent = "Please write a raw prompt input first...";
        return;
      }

      const optimized = `Act as an expert ${persona}. Your objective is to address the following query: "${raw}".

Strict Guidelines for Execution:
1. Tone Constraints: Use a tone that is: ${tone}.
2. Format Rules: Present the final response strictly in the style of: ${format}.
3. Logic & Completeness: Ensure everything is structured, easy to digest, actionable, and completely comprehensive with zero missing details. Do not summarize or shortcut logic.`;

      document.getElementById('out-optimized').textContent = optimized;
    }

    function copyPrompt() {
      const btn = document.getElementById('btn-copy');
      const text = btn.querySelector('span');
      const prompt = document.getElementById('out-optimized').textContent;
      navigator.clipboard.writeText(prompt).then(() => {
        text.textContent = 'Copied Prompt!';
        setTimeout(() => { text.textContent = 'Copy Optimized Prompt'; }, 2000);
      });
    }

    window.addEventListener('DOMContentLoaded', optimizePrompt);
  </script>
