<!doctype html>
<html lang="en">
  <head>
    <!-- Early Blocking Theme Loader: Eliminates Light/Dark Flashing/Flickering -->
    <script>
      (function () {
        try {
          const theme = localStorage.getItem("theme");
          if (theme === "dark") {
            document.documentElement.classList.add("dark");
            document.documentElement.classList.remove("light");
          } else {
            document.documentElement.classList.remove("dark");
            document.documentElement.classList.add("light");
          }
        } catch (e) {}
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
    />

    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />

      <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3901061173891576" crossorigin="anonymous"></script>

  <body

    <main class="flex-grow max-w-3xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-20">
      <div class="text-center">
        <div class="text-7xl font-extrabold text-indigo-600 dark:text-indigo-400" aria-hidden="true">

        <h1 class="mt-4 text-3xl font-extrabold text-slate-900 dark:text-white tracking-tight">

        </h1>
        <p class="mt-3 text-base text-slate-500 dark:text-slate-400">
          Sorry, the page you requested could not be found. It may have been

        </p>

        <form
          onsubmit="return false;"
          tool-name="site-search"
          class="mt-8 max-w-md mx-auto relative"
        >
          <label for="directory-search" class="sr-only">Search tools</label>
          <input
            type="search"
            id="directory-search"
            placeholder="Search 84 free tools (e.g., mortgage, qr, base64)..."

          />
          <span class="absolute left-3.5 top-3.5 text-slate-400">
            <svg
              class="w-5 h-5"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"

          </span>
        </form>

        <div class="mt-8 flex flex-col sm:flex-row items-center justify-center gap-3">
