        - generic [ref=f20e395]:
          - heading "Understanding the Real Costs of Homeownership" [level=2] [ref=f20e396]
          - generic [ref=f20e397]:
            - generic [ref=f20e398]:
              - heading "What is Principal & Interest (P&I)?" [level=3] [ref=f20e399]
              - paragraph [ref=f20e400]: Principal is the actual cash balance of your loan that you payback to the bank. Interest is the fee charged by the lender for borrowing the money. At the beginning of your term, the majority of your monthly checkout payments go towards servicing interest. As the balance decreases over time, a larger portion is allocated directly to lowering the principal balance.
            - generic [ref=f20e401]:
              - heading "How is Property Tax & Home Insurance Handled?" [level=3] [ref=f20e402]
              - paragraph [ref=f20e403]: Typically, lenders establish an escrow account. They collect 1/12th of your annual property taxes and homeowners insurance premiums each month, then pay the local municipality and insurer directly when the bills are due.
            - generic [ref=f20e404]:
              - heading "What triggers Private Mortgage Insurance (PMI)?" [level=3] [ref=f20e405]
              - paragraph [ref=f20e406]: If you purchase a home and pay less than a 20% down payment, lenders view the loan as higher risk. To protect themselves, they require you to purchase PMI. This premium is added to your monthly costs, typically costing between 0.5% and 1.5% of the initial loan amount annually. Once your loan-to-value (LTV) ratio hits 80%, you can request to have PMI removed.
            - generic [ref=f20e407]:
              - heading "How Do Extra Payments Accelerate Wealth?" [level=3] [ref=f20e408]
              - paragraph [ref=f20e409]: Any extra payments made directly to the loan's principal balance lower the outstanding debt immediately. This means that in all following months, interest is calculated on a lower amount, speeding up the compounding rate at which you build equity, shaving years off your mortgage and saving vast amounts of cash.
