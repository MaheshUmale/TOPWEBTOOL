<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Free Secure Base64 Encoder & Decoder | Binary File & Text Translator</title>
  <meta name="description" content="Convert plain strings, text, or small binary files into standardized Base64 output streams offline. Secure, client-side. 100% Free, No Email Needed.">
  <link rel="stylesheet" href="/styles.css">


</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 min-h-screen flex flex-col pb-4 transition-colors duration-200">

  <header id="global-header"></header>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 flex-grow">

    <!-- AD A REMOVED -->

    <!-- 2-Column Grid -->
    <div class="grid grid-cols-1 lg:grid-cols-4 gap-8">

      <!-- Main Content -->
      <div class="lg:col-span-3 space-y-8">

        <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
          <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight sm:text-4xl">Base64 Encoder & Decoder</h1>
          <p class="mt-2 text-base text-slate-500">
            Convert strings or small files into standard Base64 representation formats. Simple offline translation.
          </p>
        </div>

        <!-- Calculator UI -->
        <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-6 sm:p-8 space-y-6">
          <div class="flex justify-between items-center border-b border-slate-100 pb-3">
            <h2 class="text-lg font-bold text-slate-900">Select Mode Option</h2>
            <select id="input-mode" class="px-3 py-1.5 border border-slate-300 rounded-lg bg-white font-bold text-xs text-brand-700" onchange="runTranslate()">
              <option value="encode" selected>Encode text &gt;-&gt; Base64</option>
              <option value="decode">Decode Base64 &gt;-&gt; text</option>
            </select>
          </div>

          <div class="space-y-4">
            <div>
              <label for="input-raw" class="block text-sm font-semibold text-slate-700 mb-2">Input Content</label>
              <textarea id="input-raw" rows="6" class="block w-full px-3 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-brand-500 focus:border-brand-500 text-slate-950 font-mono text-xs" oninput="runTranslate()">Hello World</textarea>
            </div>
          </div>
        </div>

        <!-- Display Area -->
        <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-4">
          <h2 class="text-lg font-bold text-slate-900 border-b border-slate-100 pb-2">Translation Result</h2>
          <pre class="bg-slate-950 text-emerald-400 p-4 rounded-xl font-mono text-xs overflow-x-auto break-all shadow-inner" id="out-translated">...</pre>
          <div class="flex justify-end pt-2">
            <button onclick="copyResult()" id="btn-copy" class="px-5 py-2.5 bg-brand-600 text-white hover:bg-brand-700 transition-colors font-bold text-sm rounded-lg shadow-sm">
              <span>Copy Result</span>
            </button>
          </div>
        </div>

      </div>

      <!-- Column 4 Sidebar -->
      <div class="lg:col-span-1 space-y-6">

        <div id="trending-sidebar"></div>

        <!-- AD B REMOVED -->

      </div>

    </div>

  </main>

  <!-- AD C REMOVED -->

  <script>
    function runTranslate() {
      const mode = document.getElementById('input-mode').value;
      const raw = document.getElementById('input-raw').value;
      const out = document.getElementById('out-translated');

      if (!raw) {
        out.textContent = "Please fill some text content first...";
        return;
      }

      if (mode === 'encode') {
        try {
          out.textContent = btoa(unescape(encodeURIComponent(raw)));
        } catch (err) {
          out.textContent = `Encoding failed: ${err.message}`;
        }
      } else {
        try {
          out.textContent = decodeURIComponent(escape(atob(raw)));
        } catch (err) {
          out.textContent = `Decoding failed: ${err.message}`;
        }
      }
    }

    function copyResult() {
      const btn = document.getElementById('btn-copy');
      const text = btn.querySelector('span');
      const result = document.getElementById('out-translated').textContent;
      navigator.clipboard.writeText(result).then(() => {
        text.textContent = 'Copied!';
        setTimeout(() => { text.textContent = 'Copy Result'; }, 2000);
      });
    }

    window.addEventListener('DOMContentLoaded', runTranslate);
  </script>
  <footer id="global-footer"></footer>
  <script src="/global.js"></script>
</body>
</html>
