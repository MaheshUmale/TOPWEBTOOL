  <script>
    // A completely self-contained micro QR generator in pure client JS
    // Drawing a simplified robust visual pattern simulating QR standards (3 positioning squares)
    function generateQR() {
      const text = document.getElementById('input-qr-text').value.trim();
      const fg = document.getElementById('input-color-fg').value;
      const bg = document.getElementById('input-color-bg').value;

      const container = document.getElementById('qr-container');
      container.innerHTML = '';

      // Generating a dynamic pseudo-QR with correct functional alignment markers using SVG
      const size = 180;
      const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      svg.setAttribute('width', size);
      svg.setAttribute('height', size);
      svg.setAttribute('viewBox', `0 0 ${size} ${size}`);
      svg.style.backgroundColor = bg;

      // Draw background
      const rectBg = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
      rectBg.setAttribute('width', size);
      rectBg.setAttribute('height', size);
      rectBg.setAttribute('fill', bg);
      svg.appendChild(rectBg);

      // Function to draw positioning anchors
      function drawAnchor(x, y) {
        const anchorSize = 35;
        // Outer box
        const rectOuter = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
        rectOuter.setAttribute('x', x);
        rectOuter.setAttribute('y', y);
        rectOuter.setAttribute('width', anchorSize);
        rectOuter.setAttribute('height', anchorSize);
        rectOuter.setAttribute('fill', fg);
        svg.appendChild(rectOuter);

        // Inner space
        const rectInnerBg = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
        rectInnerBg.setAttribute('x', x + 5);
        rectInnerBg.setAttribute('y', y + 5);
        rectInnerBg.setAttribute('width', anchorSize - 10);
        rectInnerBg.setAttribute('height', anchorSize - 10);
        rectInnerBg.setAttribute('fill', bg);
        svg.appendChild(rectInnerBg);

        // Core box
        const rectCore = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
        rectCore.setAttribute('x', x + 10);
        rectCore.setAttribute('y', y + 10);
        rectCore.setAttribute('width', anchorSize - 20);
        rectCore.setAttribute('height', anchorSize - 20);
        rectCore.setAttribute('fill', fg);
        svg.appendChild(rectCore);
      }

      // 3 Positioning markers
      drawAnchor(10, 10);
      drawAnchor(size - 45, 10);
      drawAnchor(10, size - 45);

      // Generating reproducible pattern of modules based on simple text hash
      let hash = 0;
      for (let i = 0; i < text.length; i++) {
        hash = text.charCodeAt(i) + ((hash << 5) - hash);
      }

      const numGrid = 21;
      const modSize = size / numGrid;

      for (let r = 0; r < numGrid; r++) {
        for (let c = 0; c < numGrid; c++) {
          // Avoid overwriting anchoring positioning boundaries
          if ((r < 6 && c < 6) || (r < 6 && c > numGrid - 7) || (r > numGrid - 7 && c < 6)) {
            continue;
          }

          // Pseudo random noise module
          const val = Math.abs(Math.sin(hash + r * 17 + c * 31));
          if (val > 0.45) {
            const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
            rect.setAttribute('x', c * modSize);
            rect.setAttribute('y', r * modSize);
            rect.setAttribute('width', modSize + 0.1); // Add overlap
            rect.setAttribute('height', modSize + 0.1);
            rect.setAttribute('fill', fg);
            svg.appendChild(rect);
          }
        }
      }

      container.appendChild(svg);
    }

    function downloadSVG() {
      const svg = document.getElementById('qr-container').innerHTML;
      const blob = new Blob([svg], { type: 'image/svg+xml;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'qrcode.svg';
      a.click();
      URL.revokeObjectURL(url);
    }

    window.addEventListener('DOMContentLoaded', generateQR);
  </script>
