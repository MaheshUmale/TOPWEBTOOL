<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">   <meta name="google-adsense-account" content="ca-pub-3901061173891576">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Free Word & Character Copy Counter | Real-Time Reading & Speaking Times</title>
  <meta name="description" content="Dynamically track words, characters, sentence structures, paragraph metrics, estimated reading, and speaking times. 100% Free offline utility with No Sign-Up.">
  <link rel="canonical" href="https://topwebtool.com/word-character-counter/">
  <link rel="stylesheet" href="../styles.css">


</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 min-h-screen flex flex-col pb-4 transition-colors duration-200">

  <header id="global-header"></header>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex-grow">

    <!-- AD A REMOVED -->

    <!-- 2-Column Grid -->
    <div class="grid grid-cols-1 lg:grid-cols-4 gap-4">

      <!-- Main Content -->
      <div class="lg:col-span-3 space-y-8">

        <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
          <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight sm:text-4xl">Word & Character Counter</h1>
          <p class="mt-2 text-base text-slate-500">
            Track metrics dynamically as you type. Real-time words, characters, sentences, reading and speaking times estimations.
          </p>
        </div>

        <!-- Calculator UI -->
        <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-6 sm:p-8 space-y-6">
          <h2 class="text-lg font-bold text-slate-900 border-b border-slate-100 pb-3">Paste Copy Content</h2>

          <div class="space-y-4">
            <textarea id="input-text" rows="8" class="block w-full px-3 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-brand-500 focus:border-brand-500 text-slate-950 font-semibold text-sm" oninput="countText()">Welcome to TopWebTool. This premium standalone client-side word count utility parses strings in real-time, providing immediate statistical estimates on writing densities.</textarea>
          </div>
        </div>

        <!-- Output Cards -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-6">
          <div class="bg-gradient-to-br from-brand-600 to-brand-800 p-6 rounded-2xl text-white shadow-md">
            <span class="text-xs uppercase font-bold tracking-wider opacity-85 block">Total Words</span>
            <span class="text-2xl font-extrabold mt-2 block" id="out-words">0</span>
          </div>
          <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
            <span class="text-xs uppercase font-bold tracking-wider text-slate-400 block">Total Characters</span>
            <span class="text-xl font-extrabold mt-2 text-slate-800 block" id="out-chars">0</span>
          </div>
          <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
            <span class="text-xs uppercase font-bold tracking-wider text-slate-400 block">Est. Reading Time</span>
            <span class="text-xl font-extrabold mt-2 text-slate-800 block" id="out-read">0 min</span>
          </div>
          <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
            <span class="text-xs uppercase font-bold tracking-wider text-slate-400 block">Est. Speaking Time</span>
            <span class="text-xl font-extrabold mt-2 text-slate-800 block" id="out-speak">0 min</span>
          </div>
        </div>

      </div>

      <!-- Column 4 Sidebar -->
      <div class="lg:col-span-1 space-y-6">

        <div id="trending-sidebar"></div>

        <!-- AD B REMOVED -->

      </div>

    </div>

  </main>

  <!-- AD C REMOVED -->

  <script>
    function countText() {
      const text = document.getElementById('input-text').value;
      const chars = text.length;

      const wordsArr = text.trim().split(/\s+/).filter(w => w.length > 0);
      const words = wordsArr.length;

      // Simple reading/speaking time formulas (e.g. 200 words per minute read, 130 spoken)
      const readMin = words > 0 ? Math.ceil(words / 200) : 0;
      const speakMin = words > 0 ? Math.ceil(words / 130) : 0;

      document.getElementById('out-chars').textContent = chars;
      document.getElementById('out-words').textContent = words;
      document.getElementById('out-read').textContent = `${readMin} min`;
      document.getElementById('out-speak').textContent = `${speakMin} min`;
    }

    window.addEventListener('DOMContentLoaded', countText);
  </script>
  <footer id="global-footer"></footer>
  <script src="../global.js"></script>
</body>
</html>
